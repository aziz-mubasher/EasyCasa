groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus cannot scrape the target for 2 minutes."

      - alert: SiteProbeFailing
        expr: probe_success == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Public probe failing for {{ $labels.instance }}"
          description: "Blackbox HTTP probe has failed for 2 minutes."

      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in <14 days"

  - name: latency-errors
    rules:
      - alert: HighApi5xxRate
        expr: |
          sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API 5xx error rate >2% (5m)"

      - alert: SearchLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="api",route="/search"}[5m])) by (le)
          ) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Search p95 latency >800ms (10m)"

  - name: resources
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CPU >90% on {{ $labels.instance }} (10m)"

      - alert: HostLowDisk
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk <15% free on {{ $labels.instance }}"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 180
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres active connections high (>180)"

  - name: backups
    rules:
      # Pushgateway metric from infra/backup-restore-drill.sh (Phase 39).
      - alert: BackupDrillStale
        expr: time() - easycasa_last_successful_backup_timestamp_seconds > 60 * 60 * 26
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No successful backup drill in >26h"
          description: "backup-restore-drill.sh hasn't pushed a success timestamp; backups/restore may be broken."
      - alert: BackupDrillFailing
        expr: easycasa_backup_drill_success == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Backup drill reported failure"
          description: "The last backup/restore drill failed a step (dump/restic/restore/verify)."

  # EC-26 — Aste pipeline / ops. Thresholds: edit this file (no code change).
  # Tunables documented in docs/runbooks/aste-enable.md.
  - name: aste
    rules:
      # Failure rate among terminal outcomes >20% over 1h.
      - alert: AsteAnalysisFailureRateHigh
        expr: |
          (
            sum(rate(aste_pipeline_failed_total[1h]))
            /
            clamp_min(
              sum(rate(aste_pipeline_failed_total[1h]))
                + sum(rate(aste_pipeline_ready_total[1h])),
              1e-9
            )
          ) > 0.20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Aste analysis failure rate >20% (1h)"
          description: "Terminal failed/(ready+failed) rate exceeded 20% for 15m. Check admin #aste Failures and api logs."

      # Any analysis stuck in processing >45 min (postgres-exporter custom query).
      - alert: AsteAnalysisStuckProcessing
        expr: aste_processing_max_age_seconds_age > 2700
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Aste analysis stuck processing >45m"
          description: "Max processing age exceeded 2700s. Re-run from admin #aste or inspect worker."

      # Nest /aste* HTTP 5xx rate >10% over 15m (AI service has no Prometheus — Nest routes only).
      - alert: AsteAiEndpoint5xxHigh
        expr: |
          (
            sum(rate(http_requests_total{job="api",route=~"/aste.*",status=~"5.."}[15m]))
            /
            clamp_min(
              sum(rate(http_requests_total{job="api",route=~"/aste.*"}[15m])),
              1e-9
            )
          ) > 0.10
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Aste Nest /aste* 5xx rate >10% (15m)"
          description: "User-facing Aste API errors elevated. AI internal /aste/* is not scraped — check api+ai logs."

      # Worker not ticking: uploaded backlog >0 and no terminal pipeline outcomes for 30m.
      - alert: AsteWorkerNotClaiming
        expr: |
          aste_uploaded_backlog_count > 0
          and
          (
            increase(aste_pipeline_ready_total[30m])
            + increase(aste_pipeline_failed_total[30m])
          ) == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Aste worker not claiming (backlog with no terminal outcomes 30m)"
          description: "uploaded backlog >0 but ready+failed counters flat for 30m. Check ASTE_ANALYSIS_ENABLED, api scheduler, AI_INTERNAL_TOKEN."
