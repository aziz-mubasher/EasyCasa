server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /app {
        return 301 /app/;
    }

    # Expo web export is built with experiments.baseUrl "/app".
    # Unknown routes fall back to the shell so refresh keeps the screen.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 404;
    }
}
