<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Splash</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f3ede1}
a{color:#2c6e9b}a:hover{color:#1f5478}
.grid{background-image:linear-gradient(rgba(44,110,155,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(44,110,155,.08) 1px,transparent 1px);background-size:28px 28px}
.grid.dk{background-image:linear-gradient(rgba(169,200,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(169,200,220,.07) 1px,transparent 1px)}
.vig{background:radial-gradient(closest-side,rgba(243,237,225,0) 55%,#f3ede1 100%)}
.vig.dk{background:radial-gradient(closest-side,rgba(20,33,46,0) 55%,#14212e 100%)}
@keyframes ec-rise{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes ec-fade{0%,35%{opacity:0}100%{opacity:1}}
@keyframes ec-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.rise{animation:ec-rise .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:ec-fade 1.6s ease-out both}
.bar{animation:ec-load 1.4s cubic-bezier(.45,0,.2,1) infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f3ede1; font-family: 'Bricolage Grotesque', sans-serif">
  <div class="grid" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px"></div>
  <div class="vig" style="position: absolute; left: -180px; top: -100px; width: 750px; height: 1044px"></div>
  <a href="Main.html" aria-label="Continua" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-decoration: none">
    <img class="rise" src="assets/easycasa-italia-color.png" alt="Easy Casa Italia" style="width: 262px; height: auto; display: block">
    <div class="fade" style="width: 112px; height: 3px; border-radius: 2px; background: rgba(20,33,46,.10); overflow: hidden">
      <div class="bar" style="width: 40%; height: 3px; border-radius: 2px; background: #f28c0f"></div>
    </div>
  </a>
  <div class="fade" style="position: absolute; left: 0; right: 0; bottom: 46px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <svg width="42" height="8" viewBox="0 0 42 8" aria-hidden="true"><path d="M3 8L7 0h10l-4 8z" fill="#1f8a4c"/><path d="M16 8l4-8h10l-4 8z" fill="#e9e4da"/><path d="M29 8l4-8h9l-4 8z" fill="#d7262b"/></svg>
    <span style="font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #4c5d6e">EASYCASAITA.COM</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dk = (this.props.theme ?? 'light') === 'dark';
    return {
      bg: dk ? '#14212e' : '#f3ede1',
      gridClass: dk ? 'grid dk' : 'grid',
      vigClass: dk ? 'vig dk' : 'vig',
      logo: dk ? 'assets/easycasa-italia-white.png' : 'assets/easycasa-italia-color.png',
      track: dk ? 'rgba(243,237,225,.14)' : 'rgba(20,33,46,.10)',
      white: dk ? '#f3ede1' : '#e9e4da',
      muted: dk ? '#a9c8dc' : '#4c5d6e'
    };
  }
}
</script>
</body>
</html>
