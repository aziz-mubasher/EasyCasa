<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyCasa — Come funziona per chi compra</title>
<style>
  :root{
    --ink:#14212E; --parchment:#F3EDE1; --azure:#2C6E9B; --ochre:#C08A1E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:Georgia,"Times New Roman",serif;color:var(--parchment)}
  .stage{position:relative;width:100vw;height:100vh;background:var(--ink)}
  .frame{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transform:scale(1.08)}
  .frame.on{opacity:1;animation:ken 12s ease-out forwards}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,33,46,.16) 0%,rgba(20,33,46,.4) 46%,rgba(20,33,46,.84) 100%)}
  .copy{position:absolute;left:0;right:0;bottom:0;padding:72px 80px 88px;max-width:1180px}
  .brand{font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-bottom:22px}
  .brand span{color:var(--ochre)}
  .kicker{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#7FB2D6;margin-bottom:16px}
  h1{font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:64px;line-height:1.05;letter-spacing:-.03em;margin-bottom:18px}
  .body{font-size:28px;line-height:1.4;color:rgba(243,237,225,.9);max-width:38ch}
  .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(243,237,225,.16)}
  .bar>i{display:block;height:100%;width:0;background:var(--ochre)}
  .hud{position:absolute;top:28px;right:36px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.08em;color:rgba(243,237,225,.55)}
  .record .hud{display:none}
  @keyframes ken{from{transform:scale(1.08)}to{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.frame.on{animation:none;transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" data-i="0" style="background-image:url('01-open.webp')"></div>
  <div class="frame" data-i="1" style="background-image:url('02-paths.webp')"></div>
  <div class="frame" data-i="2" style="background-image:url('03-search.webp')"></div>
  <div class="frame" data-i="3" style="background-image:url('04-listing.webp')"></div>
  <div class="frame" data-i="4" style="background-image:url('05-price.webp')"></div>
  <div class="frame" data-i="5" style="background-image:url('06-message.webp')"></div>
  <div class="frame" data-i="6" style="background-image:url('07-viewing.webp')"></div>
  <div class="frame" data-i="7" style="background-image:url('08-close.webp')"></div>
  <div class="shade"></div>
  <div class="copy">
    <p class="brand">easy<span>casa</span></p>
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="body" id="body"></p>
  </div>
  <div class="hud" id="hud"></div>
  <div class="bar"><i id="prog"></i></div>
</div>
<script>
const COPY = {
  it: [
    ["Per acquirenti","Comprare casa in Italia.","Un portale. Case pubblicate da privati e da agenzie immobiliari."],
    ["Due controparti","Venditore privato, o agenzia.","Ogni annuncio dice chi l’ha pubblicato. Scegli con chi vuoi parlare."],
    ["01 · Cerca","Sfoglia, poi filtra.","Cerca per zona, prezzo e tipologia. Usa Privato o Agenzia quando vuoi una sola strada."],
    ["02 · L’annuncio","Vedi la casa. Vedi chi l’ha messa.","Foto, dati, prezzo richiesto — e chi ha pubblicato è chiaro: il proprietario, o l’agenzia."],
    ["03 · I dati di prezzo","Fasce ufficiali di zona, dopo l’accesso.","Le fasce OMI dell’Agenzia delle Entrate stanno accanto al prezzo richiesto. Sono dati di zona, non una perizia di questa casa."],
    ["04 · La richiesta","Scrivi a chi ha pubblicato.","Il messaggio arriva a chi ha messo l’annuncio — il proprietario o l’agenzia. EasyCasa trasporta il messaggio. Non tratta."],
    ["05 · La visita","Scegli uno slot. Ricevi conferma.","Prenota dalla disponibilità reale, come un tavolo al ristorante. Confermano loro. Tu visiti."],
    ["easycasaita.com","La casa è la stessa.","Cerca case di privati e di agenzie — poi fai tu il passo successivo."]
  ],
  en: [
    ["For buyers","Buy a home in Italy.","One portal. Homes listed by private owners and by real-estate agencies."],
    ["Two counterparties","Private seller, or agency.","Every listing says who published it. You choose who you want to deal with."],
    ["01 · Search","Browse, then filter.","Search by zone, price and type. Use Private or Agency when you want one path only."],
    ["02 · The listing","See the home. See who listed it.","Photos, facts, asking price — and a clear publisher: the owner, or the agency."],
    ["03 · Price data","Official zone ranges, after you sign in.","OMI figures from the Agenzia delle Entrate sit next to the asking price. They are zone data, not a valuation of this home."],
    ["04 · Enquire","Write to the publisher.","Your message goes to whoever listed the home — the owner or the agency. EasyCasa carries the message. It does not negotiate."],
    ["05 · Viewing","Pick a slot. Get a confirmation.","Book from their real availability, the way you book a table. They confirm. You visit."],
    ["easycasaita.com","The house is the same.","Search homes listed by owners and by agencies — then take the next step yourself."]
  ],
  es: [
    ["Para compradores","Comprar casa en Italia.","Un portal. Casas publicadas por particulares y por agencias inmobiliarias."],
    ["Dos contrapartes","Vendedor particular, o agencia.","Cada anuncio dice quién lo publicó. Tú eliges con quién quieres hablar."],
    ["01 · Busca","Explora, luego filtra.","Busca por zona, precio y tipo. Usa Particular o Agencia cuando quieras un solo camino."],
    ["02 · El anuncio","Mira la casa. Mira quién la publicó.","Fotos, datos, precio pedido — y un publicador claro: el propietario, o la agencia."],
    ["03 · Datos de precio","Rangos oficiales de zona, tras iniciar sesión.","Las cifras OMI de la Agenzia delle Entrate van junto al precio pedido. Son datos de zona, no una tasación de esta casa."],
    ["04 · La consulta","Escribe a quien publicó.","Tu mensaje llega a quien puso el anuncio — el propietario o la agencia. EasyCasa transporta el mensaje. No negocia."],
    ["05 · La visita","Elige un hueco. Recibe confirmación.","Reserva desde su disponibilidad real, como una mesa. Ellos confirman. Tú visitas."],
    ["easycasaita.com","La casa es la misma.","Busca casas de particulares y de agencias — luego da tú el siguiente paso."]
  ]
};
const MS = [8000,10000,10000,10000,10000,10000,10000,9000];
const q = new URLSearchParams(location.search);
const lang = COPY[q.get("lang")] ? q.get("lang") : "it";
const still = q.has("still");
const start = Math.max(0, Math.min(Number(q.get("scene")||0), 7));
document.documentElement.lang = lang;
if (q.has("record")) document.body.classList.add("record");
const frames = [...document.querySelectorAll(".frame")];
const kicker = document.getElementById("kicker");
const title = document.getElementById("title");
const body = document.getElementById("body");
const hud = document.getElementById("hud");
const prog = document.getElementById("prog");
const copy = COPY[lang];
let i = start;
function paint(n){
  frames.forEach((el, idx) => el.classList.toggle("on", idx === n));
  kicker.textContent = copy[n][0];
  title.textContent = copy[n][1];
  body.textContent = copy[n][2];
  hud.textContent = (n+1) + " / 8";
}
paint(i);
if (still) {
  const prior = MS.slice(0, i).reduce((a,b)=>a+b,0);
  const total = MS.reduce((a,b)=>a+b,0);
  prog.style.width = ((prior + MS[i]) / total * 100) + "%";
} else {
  const t0 = performance.now();
  const prior0 = MS.slice(0, i).reduce((a,b)=>a+b,0);
  const total = MS.reduce((a,b)=>a+b,0);
  let acc = 0;
  function tick(now){
    const elapsed = now - t0 - acc;
    if (elapsed >= MS[i]) {
      acc += MS[i];
      if (i >= 7) { prog.style.width = "100%"; return; }
      i += 1;
      paint(i);
    }
    prog.style.width = ((prior0 + (now - t0)) / total * 100) + "%";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
