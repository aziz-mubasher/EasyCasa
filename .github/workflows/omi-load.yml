name: omi-load

# EC-2 — fixture load + verify against scratch PostGIS+pgvector.
# National CSVs are not in git; CI uses migration/omi/fixtures/ (Lombardia).

on:
  pull_request:
    paths:
      - 'migration/sql/**'
      - 'migration/omi/**'
      - 'infra/postgres/**'
      - '.github/workflows/omi-load.yml'
  push:
    branches: [main]
    paths:
      - 'migration/sql/**'
      - 'migration/omi/**'
      - 'infra/postgres/**'
      - '.github/workflows/omi-load.yml'
  workflow_dispatch:

jobs:
  fixture-load:
    name: OMI fixture migrate + load + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PostGIS + pgvector image
        run: docker build -t easycasa-omi-db ./infra/postgres

      - name: Start scratch database
        run: |
          docker run -d --name omi-db \
            -e POSTGRES_USER=omi \
            -e POSTGRES_PASSWORD=omi \
            -e POSTGRES_DB=omi \
            -p 5432:5432 \
            easycasa-omi-db
          for i in $(seq 1 60); do
            docker exec omi-db pg_isready -U omi -d omi && break
            sleep 1
          done

      - name: Apply migrations from zero
        run: |
          for f in migration/sql/*.sql; do
            echo "APPLY $(basename "$f")"
            docker exec -i omi-db psql -U omi -d omi -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Load Lombardia fixture
        working-directory: migration/omi/fixtures
        run: |
          docker cp omi_zone_quotes.csv omi-db:/tmp/
          docker cp omi_quotes.csv omi-db:/tmp/
          sed "s|FROM 'omi_zone_quotes.csv'|FROM '/tmp/omi_zone_quotes.csv'|; s|FROM 'omi_quotes.csv'|FROM '/tmp/omi_quotes.csv'|" load.sql > /tmp/load-abs.sql
          docker cp /tmp/load-abs.sql omi-db:/tmp/load-abs.sql
          docker exec omi-db psql -U omi -d omi -v ON_ERROR_STOP=1 -f /tmp/load-abs.sql

      - name: Verify fixture
        run: |
          docker cp migration/omi/fixtures/verify.sql omi-db:/tmp/verify.sql
          docker exec omi-db psql -U omi -d omi -v ON_ERROR_STOP=1 -f /tmp/verify.sql

      - name: Idempotent second load
        run: |
          docker exec omi-db psql -U omi -d omi -v ON_ERROR_STOP=1 -f /tmp/load-abs.sql
          docker cp migration/omi/fixtures/verify.sql omi-db:/tmp/verify.sql
          docker exec omi-db psql -U omi -d omi -v ON_ERROR_STOP=1 -f /tmp/verify.sql
