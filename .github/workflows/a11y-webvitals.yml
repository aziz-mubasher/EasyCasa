name: a11y-webvitals

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly against production

permissions:
  contents: read

jobs:
  # PR gate: measures the branch, so a title (or other a11y) fix can go green
  # before deploy. Production URLs stay on schedule — they only change on VPS.
  pa11y-preview:
    name: Accessibility preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easycasa/shared build && pnpm --filter @easycasa/web build
      - run: npm i -g pa11y-ci wait-on
      - name: Start web preview
        run: pnpm --filter @easycasa/web start &
      - run: npx wait-on http://127.0.0.1:3000/it
      - run: pa11y-ci --config .pa11yci.preview.json

  pa11y-production:
    name: Accessibility production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g pa11y-ci
      - run: pa11y-ci --config .pa11yci.json

  lighthouse-preview:
    name: Web Vitals preview (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easycasa/shared build && pnpm --filter @easycasa/web build
      - run: npm i -g @lhci/cli wait-on
      - name: Start web preview
        run: pnpm --filter @easycasa/web start &
      - run: npx wait-on http://127.0.0.1:3000/it
      - run: lhci autorun --config=lighthouserc.preview.json

  lighthouse-production:
    name: Web Vitals production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @lhci/cli
      # Remote collect against production flakes as NO_FCP / PROTOCOL_TIMEOUT
      # on GitHub-hosted Chrome (small /dev/shm, CDP hang). Retry that once;
      # assertion failures still fail the job.
      - name: Lighthouse CI against production
        run: |
          set -o pipefail
          log="$(mktemp)"
          if lhci autorun --config=lighthouserc.json 2>&1 | tee "$log"; then
            exit 0
          fi
          if grep -Eq 'NO_FCP|PROTOCOL_TIMEOUT' "$log"; then
            echo "::warning::LHCI collect flake (NO_FCP/PROTOCOL_TIMEOUT); retrying once"
            lhci autorun --config=lighthouserc.json
          else
            exit 1
          fi
